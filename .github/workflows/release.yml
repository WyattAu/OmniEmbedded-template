# Tag → UF2/ELF/BIN artifacts per board, attested.
name: release

on:
  push:
    tags: ["v*"]


jobs:
  firmware:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico
            preset: pico-release
          - board: pico2
            preset: pico2-release
    if: ${{ github.repository_owner == 'WyattAu' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          # audit mode: egress is logged, not blocked -- evidence first,
          # enforcement after review (OMNI-CORE 11j, research note 42).
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - run: |
          ./scripts/ensure-pico-sdk.sh
          cmake --preset ${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }} -j"$(nproc)"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "build/${{ matrix.preset }}/omni-firmware.*"
      - run: mkdir -p dist && cp build/${{ matrix.preset }}/omni-firmware.* dist/
      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b  # v3
        with:
          files: dist/*

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # SBOM of the dependency graph ships with the release (research note 40).
      - name: generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
