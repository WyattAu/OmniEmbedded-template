# Two personalities, one gate: host tests + cross build + size budgets.
# HIL (hardware-in-loop) smoke lives in .forgejo/workflows/build.yml — it
# needs the self-hosted embedded runner, which only exists there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot (SDK pin drift)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: cmake --preset host-debug && cmake --build build/host-debug && ctest --preset host --test-dir build/host-debug

  pico:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico
            preset: pico-release
          - board: pico2
            preset: pico2-release
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - run: |
          ./scripts/ensure-pico-sdk.sh
          cmake --preset ${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }} -j"$(nproc)"
      - run: ./scripts/size.sh build/${{ matrix.preset }}/omni-firmware.elf
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: build/${{ matrix.preset }}/omni-firmware.*

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-contract.sh

  # Loop 2: performance budget. Advisory for one loop, then graduates to a
  # blocking gate (LOOP.md graduation policy). Same scripts/ commands the
  # developer runs locally - never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - run: make bench
